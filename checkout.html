<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | GameZone Store</title><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">GZ</span><span>GameZone<span class="brand-light"> Store</span></span></a><div class="checkout-label">🔒 Demo checkout</div><nav class="header-actions"><a href="cart.html">← Cart</a></nav></header>
<main class="wrap page-main"><div class="page-title"><span class="eyebrow">ALMOST GAME TIME</span><h1>Checkout</h1><p class="muted">Enter sample delivery details to place a demo order.</p></div><div id="checkoutRoot" class="checkout-layout"><form id="checkoutForm" class="checkout-card form-stack"><h2>Delivery details</h2><label>Full name<input name="name" required autocomplete="name" placeholder="Your full name"></label><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Phone number<input name="phone" type="tel" required pattern="[0-9+() -]{8,18}" placeholder="Your phone number"></label><label>Delivery address<textarea name="address" rows="3" required placeholder="House no., street, area"></textarea></label><div class="two-fields"><label>City<input name="city" required placeholder="City"></label><label>PIN code<input name="pin" required pattern="[0-9]{6}" inputmode="numeric" placeholder="6-digit PIN"></label></div><div class="notice">Demo checkout only — no payment will be collected and no real shipment will be created.</div><button class="btn btn-primary full-width">Place demo order ↗</button><p id="checkoutMessage" class="form-message" role="status"></p></form><aside id="checkoutSummary" class="summary-card"></aside></div></main>
<footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark">GZ</span><span>GameZone<span class="brand-light"> Store</span></span></a><p class="footer-small">Demo store for learning purposes.</p></footer><script src="script.js"></script></body></html>
